# Prometheus for the GPU benchmark (benchmarks/gpu/run_gpu_bench.sh): scrapes observability/gpu_exporter.py
# every second so short training stages get enough samples, and loads the shared alert/recording rules.
global:
  scrape_interval: 1s
  evaluation_interval: 5s

rule_files:
  - ../../observability/prometheus/rules.yml

scrape_configs:
  - job_name: gpu-local
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9400"]
