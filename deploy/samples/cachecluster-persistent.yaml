apiVersion: cache.cloudvanguard.io/v1alpha1
kind: CacheCluster
metadata:
  name: vc
  namespace: default
spec:
  replicas: 3
  upstreamPrimary: http://vllm.inference.svc.cluster.local:8000
  upstreamFallback: http://openai-shim.inference.svc.cluster.local:8000
  maxCacheBytes: 256Mi
  image: ghcr.io/jchetan26/vanguard-proxy:0.4.0
  persistence:
    storageClassName: cloudvanguard-block
    size: 1Gi                    # two snapshot slots of ~512Mi each
    snapshotIntervalSeconds: 60
  # OpenTelemetry tracing (Milestone 2). Rendered into each pod's OTEL_*
  # environment; changing it rolls the pods, leaving it unchanged never does.
  # Progress: kubectl get cc vc -o jsonpath='{.status.tracing}' and the
  # TracingReady condition (Exporting / RolloutPending / ExportFailing / ...).
  tracing:
    enabled: true
    endpoint: http://otel-collector.observability.svc.cluster.local:4318   # base URL; /v1/traces is appended
    samplerRatio: "0.1"          # parent-based: an incoming traceparent's decision wins
    serviceName: vanguard-proxy  # each pod adds service.instance.id = its pod name
    batch:
      scheduleDelayMillis: 2000
      maxQueueSize: 8192
      maxExportBatchSize: 1024   # must not exceed maxQueueSize (validated by the API server)
      exportTimeoutMillis: 5000
---
apiVersion: v1
kind: Secret
metadata:
  name: acme-api-keys
  namespace: default
stringData:
  api-keys: |
    sk-acme-prod-1
---
apiVersion: cache.cloudvanguard.io/v1alpha1
kind: TenantCachePolicy
metadata:
  name: acme
  namespace: default
spec:
  tenantId: acme
  clusterRef: vc
  apiKeysSecretRef: {name: acme-api-keys}
  rpmLimit: 1200
  tpmLimit: 500000
  semanticMode: lexical
  ttlSeconds: 3600
---
# Point-in-time backup of pod vc-0's warm cache (external-snapshotter required).
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: vc-0-warm-cache-backup
  namespace: default
spec:
  volumeSnapshotClassName: cloudvanguard-snapshots
  source:
    persistentVolumeClaimName: warm-cache-vc-0
