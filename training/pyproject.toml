[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudvanguard-training"
version = "0.0.0"
description = "CloudVanguard Milestone 3: PEFT/LoRA fine-tuning, quantization and evaluation (scaffold, no code yet)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Declared for Milestone 3; versions are pinned when the code lands.
train = ["torch", "peft", "transformers", "accelerate", "pyarrow"]
track = ["mlflow"]
serve-eval = ["vllm"]

[tool.setuptools.packages.find]
where = ["src"]
