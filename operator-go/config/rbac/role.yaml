---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cache.cloudvanguard.io
  resources:
  - cacheclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cache.cloudvanguard.io
  resources:
  - cacheclusters/finalizers
  verbs:
  - update
- apiGroups:
  - cache.cloudvanguard.io
  resources:
  - cacheclusters/status
  - tenantcachepolicies/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - cache.cloudvanguard.io
  resources:
  - tenantcachepolicies
  verbs:
  - get
  - list
  - patch
  - update
  - watch
