  names:
    kind: TenantCachePolicy
    listKind: TenantCachePolicyList
    plural: tenantcachepolicies
    shortNames:
    - tcp
    singular: tenantcachepolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantId
      name: Tenant
      type: string
    - jsonPath: .spec.rpmLimit
      name: RPM
      type: integer
    - jsonPath: .spec.tpmLimit
      name: TPM
