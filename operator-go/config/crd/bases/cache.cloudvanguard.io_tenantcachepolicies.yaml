      type: string
    - jsonPath: .status.applied
      name: Applied
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TenantCachePolicy configures limits and caching for one tenant.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TenantCachePolicySpec is the desired configuration of one
              tenant on the gateway.
            properties:
              apiKeysSecretRef:
                description: |-
                  Secret with the tenant's API keys. Only SHA-256 hashes of the keys are
                  distributed to the gateways.
                properties:
                  key:
                    default: api-keys
                    description: Key holding one API key per line.
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              clusterRef:
                description: CacheCluster this policy applies to. Empty = every CacheCluster
                  in the namespace.
                type: string
              rpmLimit:
                description: Cluster-wide requests per minute (0 = unlimited). Each
                  of N gateways enforces 1/N.
                format: int64
                minimum: 0
                type: integer
              semanticMode:
                description: 'Semantic cache mode for this tenant (default: the gateway''s).'
                enum:
                - lexical
                - neural
                - "off"
                type: string
              semanticThreshold:
                description: |-
                  Minimum cosine similarity for a semantic hit, as a decimal string in
                  (0, 1], e.g. "0.96". Default: 0.94 lexical, 0.96 neural.
                pattern: ^(0\.[0-9]*[1-9][0-9]*|1(\.0+)?)$
                type: string
              tenantId:
                description: Tenant identifier used for rate limiting, cache isolation
                  and metrics.
                pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$
                type: string
              tpmLimit:
                description: Cluster-wide estimated tokens per minute sent upstream
                  (0 = unlimited).
                format: int64
                minimum: 0
                type: integer
              ttlSeconds:
                description: 'Cache TTL for this tenant''s entries (default: the cluster''s
                  defaultTtlSeconds).'
                format: int32
                maximum: 2592000
                minimum: 0
                type: integer
            required:
            - tenantId
            type: object
          status:
            description: TenantCachePolicyStatus reports whether the policy is live
              on the gateways.
            properties:
              applied:
                description: True once ObservedGeneration is rendered into every target
                  cluster's control document.
                type: boolean
              appliedClusters:
                description: Clusters currently serving this policy.
                items:
                  type: string
                type: array
              conditions:
                description: 'Conditions: Applied, Conflict.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
