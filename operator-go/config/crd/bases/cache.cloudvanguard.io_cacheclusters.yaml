---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: cacheclusters.cache.cloudvanguard.io
spec:
  group: cache.cloudvanguard.io
  names:
    kind: CacheCluster
    listKind: CacheClusterList
    plural: cacheclusters
    shortNames:
    - cc
    singular: cachecluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.syncedReplicas
      name: Synced
      type: integer
    - jsonPath: .status.configVersion
      name: Config
      type: integer
    - jsonPath: .status.conditions[?(@.type=="TracingReady")].reason
      name: Tracing
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CacheCluster is a ring of vanguard-proxy gateways.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CacheClusterSpec describes a fleet of vanguard-proxy gateways that share one
              consistent-hash ring.
            properties:
              defaultTtlSeconds:
                default: 3600
                description: Default cache entry TTL (tenants may override via TenantCachePolicy).
                format: int32
                minimum: 0
                type: integer
              image:
                default: ghcr.io/jchetan26/vanguard-proxy:0.3.0
                description: Container image for vanguard-proxy.
                type: string
              maxCacheBytes:
                anyOf:
                - type: integer
                - type: string
                default: 256Mi
                description: |-
                  Response cache capacity per pod. A pointer so that "unset" is omitted on
                  the wire and the API server applies the default (a zero Quantity value
                  would serialize as "0").
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              persistence:
                description: |-
                  Warm-cache persistence: each pod gets a raw block volume (CSI,
                  volumeMode Block) that vanguard-proxy snapshots its cache to, so a
                  restarted or rescheduled pod resumes with a warm cache.
                properties:
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 1Gi
                    description: Volume size per pod. Each snapshot slot gets just
                      under half of it.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  snapshotIntervalSeconds:
                    default: 60
                    description: How often pods snapshot their cache (they also snapshot
                      on SIGTERM).
                    format: int32
                    minimum: 0
                    type: integer
                  storageClassName:
                    description: StorageClass provisioning the volumes, e.g. one backed
                      by csi.cloudvanguard.io.
                    type: string
                type: object
              replicas:
                default: 3
                description: Number of gateway pods (ring members).
                format: int32
                maximum: 256
                minimum: 1
                type: integer
              tracing:
                description: |-
                  OpenTelemetry tracing: vanguard-proxy exports spans over OTLP/HTTP to a
                  collector. Rendered into the pods' OTEL_* environment, so changing it
                  rolls the pods; leaving it unchanged never does.
                properties:
                  batch:
                    description: |-
                      Batch span processor settings (OTEL_BSP_*); unset fields keep the
                      proxy defaults (5000 ms, queue 2048, batch 512, timeout 10000 ms).
                    properties:
                      exportTimeoutMillis:
                        description: OTLP request timeout (OTEL_EXPORTER_OTLP_TIMEOUT).
                        format: int32
                        maximum: 600000
                        minimum: 1
                        type: integer
                      maxExportBatchSize:
                        description: Spans per OTLP request (OTEL_BSP_MAX_EXPORT_BATCH_SIZE).
                        format: int32
                        maximum: 1048576
                        minimum: 1
                        type: integer
                      maxQueueSize:
                        description: Ended spans buffered per pod; more are dropped
                          and counted (OTEL_BSP_MAX_QUEUE_SIZE).
                        format: int32
                        maximum: 16777216
                        minimum: 1
                        type: integer
                      scheduleDelayMillis:
                        description: Max delay between exports (OTEL_BSP_SCHEDULE_DELAY).
                        format: int32
                        maximum: 3600000
                        minimum: 1
                        type: integer
                    type: object
                    x-kubernetes-validations:
                    - message: maxExportBatchSize must not exceed maxQueueSize (defaults
                        512 and 2048)
                      rule: '(has(self.maxExportBatchSize) ? self.maxExportBatchSize
                        : 512) <= (has(self.maxQueueSize) ? self.maxQueueSize : 2048)'
                  enabled:
                    default: false
                    description: Export spans. When false the OTEL_* variables are
                      not set at all.
                    type: boolean
                  endpoint:
                    description: |-
                      OTLP/HTTP base URL of the collector, e.g. http://otel-collector.observability:4318.
                      Spans are POSTed to <endpoint>/v1/traces. Plain http only: run a
                      collector (or agent) in-cluster and let it handle TLS to the backend.
                    maxLength: 2048
                    pattern: ^http://[^\s/]+(/\S*)?$
                    type: string
                    x-kubernetes-validations:
                    - message: give the collector base URL; /v1/traces is appended
                      rule: '!self.endsWith(''/v1/traces'') && !self.endsWith(''/v1/traces/'')'
                  samplerRatio:
                    default: "1"
                    description: |-
                      Fraction of new traces to sample, as a decimal string in [0, 1]
                      (OTEL_TRACES_SAMPLER_ARG). Sampling is parent-based: an incoming
                      traceparent's decision always wins, so a trace is never cut in half.
                    pattern: ^(0(\.[0-9]{1,6})?|1(\.0{1,6})?)$
                    type: string
                  serviceName:
                    description: |-
                      service.name resource attribute (default vanguard-proxy). Each pod also
                      reports service.instance.id = its pod name.
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - enabled
                type: object
                x-kubernetes-validations:
                - message: endpoint is required when tracing is enabled
                  rule: '!self.enabled || has(self.endpoint)'
              upstreamFallback:
                description: Optional fallback upstream used when the primary's circuit
                  is open.
                pattern: ^http://[^\s/]+(/\S*)?$
                type: string
              upstreamPrimary:
                description: Primary OpenAI-compatible upstream, e.g. a vLLM service.
                pattern: ^http://[^\s/]+(/\S*)?$
                type: string
              vnodes:
                default: 1000
                description: Virtual nodes per ring member.
                format: int32
                maximum: 100000
                minimum: 1
                type: integer
            required:
            - replicas
            - upstreamPrimary
            type: object
          status:
            description: CacheClusterStatus is the observed state of a CacheCluster.
            properties:
              conditions:
                description: 'Conditions: Available, ConfigSynced, TracingReady.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configHash:
                description: Hash of the rendered control document.
                type: string
              configVersion:
                description: Version of the control document (ring + tenant policies)
                  last rendered.
                format: int64
                type: integer
              endpoints:
                description: Data-plane endpoints (host:port) of ready ring members.
                items:
                  type: string
                type: array
              observedGeneration:
                description: Generation of the spec most recently reconciled.
                format: int64
                type: integer
              readyReplicas:
                description: Pods passing their readiness probe.
                format: int32
                type: integer
              syncedReplicas:
                description: Ready pods confirmed to run ConfigVersion (pushed via
                  the admin API).
                format: int32
                type: integer
              tracing:
                description: Tracing as reported by the pods (nil until the first
                  reconcile).
                properties:
                  configuredReplicas:
                    description: Ready pods whose proxy reports exactly the configured
                      tracing settings.
                    format: int32
                    type: integer
                  enabled:
                    description: Tracing is enabled in the applied spec.
                    type: boolean
                  exportFailingReplicas:
                    description: Ready pods whose most recent OTLP export failed.
                    format: int32
                    type: integer
                  lastExportError:
                    description: Error of the most recent failed export (one failing
                      pod's, if several).
                    type: string
                  samplerRatio:
                    description: Sampling ratio in effect (canonical form of spec.tracing.samplerRatio).
                    type: string
                  tracesEndpoint:
                    description: OTLP traces URL the pods are configured to export
                      to.
                    type: string
                required:
                - enabled
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      scale:
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.readyReplicas
      status: {}
