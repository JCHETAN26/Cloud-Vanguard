name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Gateway (C++ unit + integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libgtest-dev nlohmann-json3-dev
      - name: Build and test
        run: make test

  gateway-asan:
    name: Gateway (AddressSanitizer + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libgtest-dev nlohmann-json3-dev
      - name: Build and test under sanitizers
        run: make test-asan

  operator:
    name: Operator + CSI driver (Go, envtest, csi-sanity)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator-go/go.mod
          cache-dependency-path: operator-go/go.sum
      - name: Install QEMU tools
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-utils qemu-system-x86
      - name: Test
        run: make test-go
      - name: Generated code and manifests are committed
        run: git diff --exit-code -- operator-go

  training:
    name: Training pipeline (PyTorch, CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r training/requirements.txt
      - name: Test
        run: make test-training PYTHON=python

  manifests:
    name: Manifests + scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Render kustomizations, check scripts
        run: make verify-deploy
